<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Italien — PC &amp; Tablette</title>
<style>
:root { --bleu-fonce: #003366; --bleu-clair: #eef4fb; --vert-italie: #008c45; --fond: #f4f6f9; --bordure: #d5dde6; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--fond); margin: 0; padding: 0; color: #222; }
header { background: var(--bleu-fonce); color: white; padding: 14px 20px; border-bottom: 4px solid var(--vert-italie); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
header h1 { margin: 0; font-size: 20px; }
.seance-bar { background: #fffdf5; border-bottom: 1px solid #e6d79c; padding: 11px 16px; display: flex; justify-content: center; align-items: center; gap: 9px; flex-wrap: wrap; font-size: 14px; }
button.btn-ouverture { background: var(--bleu-fonce); color: white; border: none; padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
button.btn-save { background: var(--vert-italie); color: white; border: none; padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
button.btn-ajout-dico { background: #ffffff; color: var(--bleu-fonce); border: 1px solid var(--bleu-fonce); padding: 8px 13px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
.statut-seance { font-size: 13px; color: #4a3b00; width: 100%; text-align: center; margin-top: 2px; }
.drawer-box { display: none; background: white; border: 1px solid var(--bordure); border-radius: 10px; padding: 16px 20px; max-width: 960px; margin: 14px auto; box-shadow: 0 2px 10px rgba(0,0,0,.08); line-height: 1.5; }
.auto-fill-box { background: #f0f6ff; border: 1px solid #b8d0eb; border-radius: 8px; padding: 12px; margin-top: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
.form-champ { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.form-champ.full { grid-column: 1 / -1; }
input, select { padding: 8px 11px; font-size: 15px; border-radius: 7px; border: 1px solid #99aabb; background: #fff; font-family: inherit; }
.btn-mini { background: var(--bleu-clair); color: var(--bleu-fonce); border: 1px solid #9ab4cf; border-radius: 6px; padding: 7px 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
button.action-btn { padding: 10px 15px; margin: 4px 6px 4px 0; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #f9f9f9; font-size: 14px; }
button.primary-btn { background: var(--vert-italie); color: white; border: none; font-weight: bold; }
</style>
</head>
<body>

<header>
    <div>
        <h1>Atelier Italien</h1>
        <div style="font-size:13px; opacity:0.9;">Connecté à GitHub • Synchronisation manuelle</div>
    </div>
</header>

<div class="seance-bar">
    <button type="button" class="btn-ouverture" onclick="chargerDictionnaireDepuisGithub()">📥 Charger le dictionnaire depuis GitHub</button>
    <button type="button" class="btn-save" onclick="telechargerSauvegarde()">💾 Télécharger la sauvegarde</button>
    <button type="button" class="btn-ajout-dico" onclick="document.getElementById('ajoutDicoBox').style.display='block'">+ Ajouter un mot</button>
    <span id="statutSeance" class="statut-seance">Prêt. Le dictionnaire par défaut est chargé.</span>
</div>

<div id="ajoutDicoBox" class="drawer-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0;">Ajouter une entrée</h3>
        <button type="button" class="btn-mini" onclick="document.getElementById('ajoutDicoBox').style.display='none'">Fermer</button>
    </div>

    <div class="auto-fill-box">
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
            <input type="password" id="apiTokenInput" placeholder="Clé API OpenRouter (sk-or-v1-...)" style="flex:1;" onchange="sauvegarderConfigApi()">
            <button type="button" class="btn-mini" onclick="testerConnexionApi()">Tester API</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="dicoMotAuto" placeholder="Mot en français ou italien..." style="flex:1;">
            <button type="button" class="action-btn primary-btn" style="margin:0;" onclick="preremplirFicheAuto()">✨ Préremplir avec l'IA</button>
        </div>
        <div id="statutAutoFill" style="font-size:12px; color:#003366; margin-top:6px;"></div>
    </div>

    <div class="form-grid">
        <div class="form-champ"><label>Mot Italien *</label><input type="text" id="dicoMotIt"></div>
        <div class="form-champ"><label>Traduction Français *</label><input type="text" id="dicoTradFr"></div>
        <div class="form-champ"><label>Catégorie</label><select id="dicoCat"></select></div>
        <div class="form-champ"><label>Phrase d'exemple (IT)</label><input type="text" id="dicoPhraseIt"></div>
        <div class="form-champ full" style="margin-top:10px;">
            <button type="button" class="action-btn primary-btn" onclick="ajouterEntreeDictionnaire()">Ajouter au dictionnaire</button>
            <span id="msgAjoutDico" style="font-size:13px; color:#0b6e29; font-weight:bold; margin-left:10px;"></span>
        </div>
    </div>
</div>

<div class="container" style="max-width:960px; margin: 20px auto; padding: 0 16px;">
    <h2>Mon Dictionnaire</h2>
    <ul id="listeDico" style="background:white; padding:20px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.05); line-height:1.6;"></ul>
</div>

<script>
// Variables globales
let dico = { categories: ["Général", "Atelier", "Maison", "Voyage"], items: [] };
const API_URL = "https://openrouter.ai/api/v1/chat/completions";

// --- GESTION DU DICTIONNAIRE ET DE GITHUB ---

// Charge le fichier JSON depuis ton dépôt GitHub
async function chargerDictionnaireDepuisGithub() {
    const statut = document.getElementById("statutSeance");
    statut.textContent = "Chargement depuis GitHub...";
    
    try {
        // On cherche le fichier dans ton dossier 'fiches/'
        const resp = await fetch('fiches/dictionnaire.json'); 
        if(!resp.ok) throw new Error("Fichier non trouvé (avez-vous mis dictionnaire.json dans le dossier fiches ?)");
        
        const data = await resp.json();
        if(data && data.items) {
            dico = data;
            statut.textContent = `Succès : ${dico.items.length} mots chargés depuis GitHub.`;
            afficherDictionnaire();
            mettreAJourCategories();
        }
    } catch(err) {
        statut.textContent = `Erreur : ${err.message}. L'application utilise les données locales.`;
        // Fallback sur la mémoire du navigateur si le fichier n'est pas sur GitHub
        const local = localStorage.getItem("atelier_dico");
        if(local) { dico = JSON.parse(local); afficherDictionnaire(); mettreAJourCategories(); }
    }
}

function afficherDictionnaire() {
    const ul = document.getElementById("listeDico");
    ul.innerHTML = "";
    if(dico.items.length === 0) {
        ul.innerHTML = "<li>Aucun mot pour le moment. Ajoutez-en ou chargez depuis GitHub.</li>";
        return;
    }
    dico.items.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `<b>${item.mot_it}</b> = ${item.trad_fr} <span style="color:#888; font-size:12px;">(${item.cat || 'Général'})</span>`;
        ul.appendChild(li);
    });
}

function mettreAJourCategories() {
    const select = document.getElementById("dicoCat");
    select.innerHTML = "";
    dico.categories.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c; opt.textContent = c;
        select.appendChild(opt);
    });
}

// Télécharge la sauvegarde au format JSON
function telechargerSauvegarde() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dico, null, 2));
    const a = document.createElement("a");
    a.href = dataStr;
    a.download = "dictionnaire.json";
    a.click();
    document.getElementById("statutSeance").textContent = "Fichier téléchargé ! Glissez-le dans votre dossier GitHub ou Drive.";
}

function ajouterEntreeDictionnaire() {
    const mot_it = document.getElementById("dicoMotIt").value.trim();
    const trad_fr = document.getElementById("dicoTradFr").value.trim();
    const cat = document.getElementById("dicoCat").value;
    const phrase_it = document.getElementById("dicoPhraseIt").value.trim();

    if(!mot_it || !trad_fr) {
        document.getElementById("msgAjoutDico").textContent = "Le mot et la traduction sont obligatoires.";
        return;
    }

    dico.items.unshift({ mot_it, trad_fr, cat, phrase_it });
    localStorage.setItem("atelier_dico", JSON.stringify(dico)); // Sauvegarde temporaire navigateur
    afficherDictionnaire();
    
    document.getElementById("msgAjoutDico").textContent = `"${mot_it}" ajouté !`;
    document.getElementById("dicoMotIt").value = "";
    document.getElementById("dicoTradFr").value = "";
    document.getElementById("dicoPhraseIt").value = "";
}

// --- GESTION DE L'API ---

function sauvegarderConfigApi() {
    localStorage.setItem("atelier_token", document.getElementById("apiTokenInput").value.trim());
}

function chargerConfigApi() {
    const token = localStorage.getItem("atelier_token");
    if(token) document.getElementById("apiTokenInput").value = token;
}

async function testerConnexionApi() {
    const token = document.getElementById("apiTokenInput").value.trim();
    const statut = document.getElementById("statutAutoFill");
    if(!token) { statut.textContent = "Saisissez une clé API."; return; }
    
    statut.textContent = "Test en cours...";
    try {
        const resp = await fetch(API_URL, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ model: "openrouter/free", messages: [{ role: "user", content: "Réponds juste: OK" }] })
        });
        if(resp.ok) statut.textContent = "API connectée avec succès !";
        else statut.textContent = `Erreur HTTP ${resp.status}`;
    } catch(e) {
        statut.textContent = "Erreur réseau. Vérifiez votre connexion ou l'URL.";
    }
}

async function preremplirFicheAuto() {
    const mot = document.getElementById("dicoMotAuto").value.trim();
    const token = document.getElementById("apiTokenInput").value.trim();
    const statut = document.getElementById("statutAutoFill");

    if(!mot) { statut.textContent = "Saisissez un mot à chercher."; return; }
    if(!token) { statut.textContent = "Saisissez une clé API."; return; }

    statut.textContent = "Recherche en cours...";
    
    const prompt = `Donne-moi la traduction en italien et un exemple de phrase pour : "${mot}". Réponds uniquement avec un objet JSON valide comme ceci : {"mot_it":"...", "trad_fr":"...", "phrase_it":"..."}`;

    try {
        const resp = await fetch(API_URL, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ model: "openrouter/free", messages: [{ role: "user", content: prompt }] })
        });
        
        const data = await resp.json();
        if(data.error) throw new Error(data.error.message);
        
        let texte = data.choices[0].message.content;
        texte = texte.replace(/```json/g, "").replace(/```/g, "").trim(); // Nettoyage
        const resultat = JSON.parse(texte);

        document.getElementById("dicoMotIt").value = resultat.mot_it || "";
        document.getElementById("dicoTradFr").value = resultat.trad_fr || "";
        document.getElementById("dicoPhraseIt").value = resultat.phrase_it || "";
        statut.textContent = "Fiche préremplie par l'IA !";
    } catch(e) {
        statut.textContent = "Échec de l'IA : " + e.message;
    }
}

// Initialisation
chargerConfigApi();
mettreAJourCategories();
afficherDictionnaire();
</script>
</body>
</html>
